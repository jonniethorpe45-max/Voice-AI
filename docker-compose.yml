version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surplus_ops_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surplus_ops_worker
    command: python -m app.jobs.worker
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: surplus_ops_db
    environment:
      POSTGRES_DB: surplus_ops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d surplus_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: surplus_ops_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
