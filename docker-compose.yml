version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    environment:
      VOCALFIT_REDIS_URL: redis://redis:6379/0
      VOCALFIT_STORAGE_ROOT: /app/data
      VOCALFIT_MODEL_ROOT: /app/models
      VOCALFIT_USE_GPU: "true"
    depends_on:
      - redis
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python worker.py
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./models:/app/models
    environment:
      VOCALFIT_REDIS_URL: redis://redis:6379/0
      VOCALFIT_STORAGE_ROOT: /app/data
      VOCALFIT_MODEL_ROOT: /app/models
      VOCALFIT_USE_GPU: "true"
    depends_on:
      - redis
    restart: unless-stopped
