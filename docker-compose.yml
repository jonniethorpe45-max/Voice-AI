version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxdeeds_app
    command: sh -c "npm run prisma:generate && npm run prisma:deploy && npm run dev"
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15
    container_name: taxdeeds_postgres
    environment:
      POSTGRES_DB: taxdeeds
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d taxdeeds"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: taxdeeds_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
